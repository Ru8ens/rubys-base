<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Ruby's Base</title>
<script src="supabase.js"></script>
<style>
@font-face{font-family:'Syne';src:url('fonts/syne-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Syne';src:url('fonts/syne-latin-800-normal.woff2') format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:'Outfit';src:url('fonts/outfit-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Outfit';src:url('fonts/outfit-latin-500-normal.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Outfit';src:url('fonts/outfit-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Outfit';src:url('fonts/outfit-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
/* Ruby's Base. Idea: un día como lista de tareas (comer, entrenar, hábitos) sobre índigo profundo, con aqua para lo hecho. */
:root {
  --bg: #0f0c26;
  --surf: #1a1640;
  --surf2: #221d4b;
  --line: #2c2760;
  --ink: #f3f1ff;
  --muted: #a8a1d6;
  --aqua: #4ff0c2;
  --violet: #9b8cff;
  --warn: #ffb36b;
  --fig: #9b8cff;
  --fig-back: #4a3f99;
  --prop: #3a3473;
  --accent: #4ff0c2;
  --surface: #1a1640;
  --display: "Syne", "Arial Black", sans-serif;
  --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body.auth header.top, body.auth main, body.auth nav.tabs { display: none; }
#login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); }
#login[hidden] { display: none; }
#login form { width: min(380px, 100%); display: grid; gap: 12px; }
#login img { width: 84px; height: 84px; border-radius: 22px; }
#login h1 { font-family: var(--display); font-size: 30px; margin: 6px 0 0; }
#login input { background: var(--surf); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; color: var(--ink); width: 100%; font-size: 16px; }
#login .btn { padding: 12px; font-size: 15px; }
#login .msg { min-height: 20px; color: var(--muted); font-size: 13.5px; margin: 0; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; padding-bottom: 96px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
.disp { font-family: var(--display); font-weight: 700; }

header.top { padding-top: calc(16px + env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hello { font-size: 13px; color: var(--muted); }
.bigdate { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; margin-top: 2px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 12px; color: var(--aqua); border: 1.5px solid var(--aqua); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.sync { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok i { background: var(--aqua); }
.sync.warn i { background: var(--warn); }

.week { display: grid; grid-template-columns: 28px repeat(7, minmax(0, 1fr)) 28px; gap: 2px; align-items: center; margin: 14px 0 12px; }
.week .nav { border: 0; background: none; color: var(--muted); font-size: 20px; padding: 0; height: 52px; }
.week .d { border: 0; background: none; display: grid; gap: 2px; justify-items: center; padding: 7px 0; border-radius: 14px; }
.week .d small { font-size: 11px; color: var(--muted); }
.week .d b { font-family: var(--display); font-size: 15px; }
.week .d i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.week .d.full i { background: var(--aqua); }
.week .d.part i { background: var(--violet); }
.week .d[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.week .d[aria-pressed="true"] small { color: var(--bg); opacity: .7; }

.hero { background: var(--aqua); color: var(--bg); border-radius: 24px; padding: 16px; display: flex; gap: 14px; align-items: center; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -36px; top: -36px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255, 255, 255, .16); }
.hero .k { font-size: 12px; font-weight: 700; opacity: .8; }
.hero .t { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.1; }
.hero .s { font-size: 12.5px; opacity: .8; margin-top: 4px; }
.hero > div { position: relative; z-index: 1; flex: 1; }
.banner { background: var(--surf2); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; margin-top: 10px; color: var(--muted); }
.banner b { color: var(--ink); }

h2 { font-family: var(--display); font-size: 14px; letter-spacing: .4px; margin: 18px 0 8px; }
h2.big { font-size: 22px; margin-top: 16px; }
.list { display: grid; gap: 8px; }
.item { background: var(--surf); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.item .row { display: flex; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; }
.item .open { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; background: none; border: 0; padding: 0; text-align: left; }
.tile { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.tile.ic { background: var(--surf2); color: var(--violet); }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.ttl { font-weight: 700; font-size: 15.5px; margin-top: 1px; }
.det { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.item.done .ttl, .item.done .det { text-decoration: line-through; opacity: .55; }
.chk { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; display: grid; place-items: center; padding: 0; }
.chk[aria-pressed="true"] { background: var(--aqua); border-color: var(--aqua); }
.chk svg { opacity: 0; }
.chk[aria-pressed="true"] svg { opacity: 1; }
.pbar { height: 6px; border-radius: 9px; background: var(--line); margin-top: 7px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--aqua); }
.more { padding: 0 14px 14px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.more ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
.more .prep { font-size: 13.5px; color: var(--muted); margin: 0; }
.inline { display: flex; gap: 8px; }
.inline input, .grid3 input, textarea, .range input { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; color: var(--ink); min-width: 0; width: 100%; }
.btn { border: 1.5px solid var(--aqua); background: transparent; color: var(--aqua); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.btn.solid { background: var(--aqua); color: var(--bg); }
.btn.ghost { border-color: var(--line); color: var(--muted); }
.glasses { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.glasses button { aspect-ratio: 1 / 1.4; border-radius: 6px; border: 1.5px solid var(--line); background: var(--bg); padding: 0; }
.glasses button[aria-pressed="true"] { background: var(--aqua); border-color: var(--aqua); }

.ex { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ex .exhead { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 10px 12px; text-align: left; }
.ex .exhead b { flex: 1; font-weight: 600; font-size: 14.5px; }
.ex .exhead span { font-size: 12.5px; color: var(--violet); font-weight: 700; white-space: nowrap; }
.ex .exhead .ok { color: var(--aqua); }
.ex .exbody { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; padding: 0 12px 12px; }
.fig { background: var(--surf2); border-radius: 12px; border: 0; padding: 4px; color: var(--ink); align-self: start; }
.fig svg { width: 100%; height: auto; display: block; }
.cue { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.grid3 { display: grid; grid-template-columns: 38px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; align-items: center; }
.grid3 .hd { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.grid3 input { padding: 7px 8px; font-size: 14px; }
.setbtn { width: 38px; height: 34px; border-radius: 9px; border: 1.5px solid var(--line); background: none; font-weight: 700; font-size: 13px; padding: 0; }
.setbtn[aria-pressed="true"] { background: var(--aqua); border-color: var(--aqua); color: var(--bg); }
.rests { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.rest-day { background: var(--surf); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(15, 12, 38, .94); border-top: 1px solid var(--line); padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
nav.tabs button { border: 0; background: none; display: grid; justify-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 4px 0; }
nav.tabs button[aria-selected="true"] { color: var(--aqua); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--aqua); color: var(--aqua); background: rgba(79, 240, 194, .08); }
.range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.range label { font-size: 11.5px; color: var(--muted); display: grid; gap: 4px; }
.shop { background: var(--surf); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px 10px; }
.shop h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 12px 0 4px; }
.sitem { display: flex; align-items: center; gap: 12px; padding: 9px 0; border: 0; border-top: 1px solid var(--line); width: 100%; background: none; text-align: left; }
.shop h3 + .sitem { border-top: 0; }
.box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-size: 13px; color: var(--bg); font-weight: 800; }
.sitem[aria-pressed="true"] .box { background: var(--aqua); border-color: var(--aqua); }
.sitem[aria-pressed="true"] .nm { text-decoration: line-through; color: var(--muted); }
.nm { flex: 1; }
.qty { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; font-size: 14px; }
.note { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }

.pcard { background: var(--surf); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
.pcard h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kv div { background: var(--surf2); border-radius: 12px; padding: 8px; }
.kv small { display: block; font-size: 11px; color: var(--muted); }
.big { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; }
.sub { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
.delta { font-weight: 700; font-size: 13px; }
.delta.down { color: var(--aqua); }
.chart svg { width: 100%; height: auto; display: block; margin-top: 10px; }
.addrow { display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 8px; margin-top: 10px; }
.addrow > * { min-width: 0; }
.addrow input { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; color: var(--ink); }
.logrow { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.logrow button { border: 0; background: none; color: var(--muted); font-size: 16px; }
.hist { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.hist th, .hist td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); }
.hist th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
.scroll { overflow-x: auto; }
details.pcard summary { font-weight: 700; cursor: pointer; }
details.pcard ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: 84px; width: min(420px, calc(100% - 32px)); background: var(--ink); color: var(--bg); border-radius: 16px; padding: 10px 16px; display: none; align-items: center; justify-content: space-between; z-index: 11; }
.timer.on { display: flex; }
.timer b { font-family: var(--display); font-size: 28px; }
.timer button { background: none; border: 1.5px solid currentColor; border-radius: 10px; padding: 6px 12px; color: inherit; }
@media (max-width: 420px) { .ex .exbody { grid-template-columns: 1fr; } .fig { max-width: 200px; } .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="auth">
<div id="login" hidden><form id="loginform" autocomplete="on">
  <img src="icons/icon-192.png" alt="">
  <h1>Ruby's Base</h1>
  <p class="sub" style="margin:0">Entra con tu email. La primera vez, crea tu cuenta.</p>
  <label class="tag" for="lg-email">Email</label><input id="lg-email" type="email" autocomplete="email" required>
  <label class="tag" for="lg-pass">Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" minlength="6" required>
  <button class="btn solid" type="submit" id="lg-in">Entrar</button>
  <button class="btn" type="button" id="lg-up">Crear cuenta</button>
  <p class="msg" id="lg-msg" role="status"></p>
</form></div>
<header class="top wrap">
  <div><div class="hello" id="hello"></div><div class="bigdate" id="bigdate"></div><div class="sync" id="sync"><i></i><span>Cargando…</span></div></div>
  <span class="brand">RUBY'S BASE</span>
</header>
<main class="wrap" id="main"></main>
<nav class="tabs" aria-label="Secciones"><div class="in" role="tablist" id="tabs"></div></nav>
<div class="timer" id="timer" role="status" aria-live="polite"><div><small>Descanso</small><br><b id="tleft">0:00</b></div><button id="tstop" type="button">Saltar</button></div>

<script>
// ================= Ejercicios =================
const G = 168;
const EX = {
  bench: { cue: "Shoulder blades squeezed, lower the bar to mid-chest, press back up over your shoulders.", anchor: "H", ax: 120, hy: 40, w: "bar", kg: true,
    props: [[50, 135, 140, 135, 6], [60, 135, 60, G, 4], [130, 135, 130, G, 4]],
    A: { t: -90, lf: [80, 0], lb: [80, 0], ar: [60, 180] }, B: { t: -90, lf: [80, 0], lb: [80, 0], ar: [180, 180] } },
  incline: { cue: "Bench at 30 to 45 degrees, lower the dumbbells to your upper chest, press up and slightly in.", anchor: "H", ax: 110, hy: 36, w: "db", kg: true,
    props: [[105, 136, 60, 82, 6], [100, 138, 140, 138, 6], [110, 138, 110, G, 4]],
    A: { t: -40, lf: [85, 0], lb: [85, 0], ar: [50, 175] }, B: { t: -40, lf: [85, 0], lb: [85, 0], ar: [150, 150] } },
  military: { cue: "Glutes and core tight, press straight overhead, head through at the top.", anchor: "F", ax: 110, w: "bar", kg: true,
    A: { t: 0, lf: [0, 0], lb: [0, 0], ar: [15, 172] }, B: { t: 0, lf: [0, 0], lb: [0, 0], ar: [178, 180] } },
  dips: { cue: "Lean slightly forward, lower until your upper arms are parallel to the floor, press back up.", anchor: "HAND", ax: 110, ay: 92, kg: true,
    props: [[86, 96, 134, 96, 6], [126, 96, 126, G, 5]],
    A: { t: 8, lf: [15, -55], lb: [15, -55], ar: [0, 0] }, B: { t: 22, lf: [15, -55], lb: [15, -55], ar: [-90, 0] } },
  pushdown: { cue: "Elbows fixed at your sides, push down to full extension, control the way back up.", anchor: "F", ax: 100, w: "handle", kg: true, cable: [128, -16],
    props: [[132, -20, 132, G, 5]],
    A: { t: 8, lf: [0, 0], lb: [0, 0], ar: [5, 150] }, B: { t: 8, lf: [0, 0], lb: [0, 0], ar: [5, 0] } },
  lateral: { cue: "Front view. Slight bend in the elbows, raise to shoulder height, lower slowly.", anchor: "F", ax: 110, w: "db", kg: true,
    A: { t: 0, lf: [4, 4], lb: [-4, -4], ar: [8, 8], arb: [-8, -8] }, B: { t: 0, lf: [4, 4], lb: [-4, -4], ar: [85, 88], arb: [-85, -88] } },
  squat: { cue: "Brace, sit down and back, thighs at least parallel, drive up through your heels.", anchor: "F", ax: 122, w: "bar", kg: true,
    A: { t: 0, lf: [0, 0], lb: [0, 0], ar: [-60, 160] }, B: { t: 35, lf: [80, -25], lb: [80, -25], ar: [-60, 160] } },
  legpress: { cue: "Feet shoulder width on the platform, lower until your knees are near 90 degrees, press without locking them.", anchor: "H", ax: 85, hy: 30, kg: true, plate: 120,
    props: [[82, 143, 33, 109, 6], [78, 144, 104, 144, 6], [62, G, 90, 144, 5]],
    A: { t: -55, lf: [160, 80], lb: [160, 80], ar: [40, 110] }, B: { t: -55, lf: [120, 120], lb: [120, 120], ar: [40, 110] } },
  rdl: { cue: "Soft knees, push the hips back, keep the bar close to your legs, feel the hamstrings.", anchor: "F", ax: 115, w: "bar", kg: true,
    A: { t: 0, lf: [3, -2], lb: [3, -2], ar: [0, 0] }, B: { t: 75, lf: [18, -6], lb: [18, -6], ar: [0, 0] } },
  legext: { cue: "Pad on your lower shins, extend fully, squeeze the quads, lower slowly.", anchor: "H", ax: 95, hy: 56, kg: true, pad: true,
    props: [[75, 118, 130, 118, 6], [80, 118, 76, 60, 6], [100, 118, 100, G, 5]],
    A: { t: -6, lf: [90, 0], lb: [90, 0], ar: [10, 20] }, B: { t: -6, lf: [90, 85], lb: [90, 85], ar: [10, 20] } },
  legcurl: { cue: "Hips pressed into the pad, curl your heels towards your glutes, control the return.", anchor: "H", ax: 120, hy: 40, kg: true, pad: true,
    props: [[80, 135, 192, 135, 6], [100, 135, 100, G, 4], [178, 135, 178, G, 4]],
    A: { t: 90, lf: [-90, -90], lb: [-90, -90], ar: [0, 20] }, B: { t: 90, lf: [-90, -175], lb: [-90, -175], ar: [0, 20] } },
  calf: { cue: "Full stretch at the bottom, pause at the top, no bouncing.", anchor: "F", ax: 105, kg: true, toes: true,
    A: { t: 0, lf: [0, 0], lb: [0, 0], ar: [-30, 170], dy: 0 }, B: { t: 0, lf: [0, 0], lb: [0, 0], ar: [-30, 170], dy: -10 } },
  pulldown: { cue: "Chest up, pull the bar to your upper chest, elbows down and back.", anchor: "H", ax: 110, hy: 34, w: "handle", kg: true, cable: [116, -18],
    props: [[96, -20, 170, -20, 5], [95, 140, 126, 140, 6], [110, 140, 110, G, 5]],
    A: { t: -8, lf: [88, 0], lb: [88, 0], ar: [178, 176] }, B: { t: -8, lf: [88, 0], lb: [88, 0], ar: [25, 168] } },
  bbrow: { cue: "Flat back, pull the bar to your lower ribs, squeeze your shoulder blades.", anchor: "F", ax: 120, w: "bar", kg: true,
    A: { t: 62, lf: [16, -5], lb: [16, -5], ar: [0, 0] }, B: { t: 62, lf: [16, -5], lb: [16, -5], ar: [-80, 0] } },
  cablerow: { cue: "Sit tall, pull the handle to your stomach, shoulders back, no swinging.", anchor: "H", ax: 78, hy: 18, w: "handle", kg: true, cable: [205, 150],
    props: [[58, 156, 98, 156, 6], [152, 140, 152, G, 5]],
    A: { t: 25, lf: [100, 65], lb: [100, 65], ar: [90, 90] }, B: { t: -8, lf: [100, 65], lb: [100, 65], ar: [-75, 90] } },

let FIGS = [];
